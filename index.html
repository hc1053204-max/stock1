<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#102a43" />
  <meta http-equiv="refresh" content="0; url=./flutter_app/preview/" />
  <title>AI 股票分析</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f3f7fa;color:#243b53;font-family:Inter,"Noto Sans TC",system-ui,sans-serif}.card{width:min(440px,100%);padding:36px 30px;border:1px solid #e6edf3;border-radius:24px;background:#fff;box-shadow:0 20px 60px #102a4314;text-align:center}.mark{display:grid;place-items:center;width:58px;height:58px;margin:0 auto 20px;border-radius:18px;background:linear-gradient(135deg,#102a43,#1c8c8c);color:white;font-size:28px}.eyebrow{color:#1c8c8c;font-size:12px;font-weight:800;letter-spacing:.14em}.card h1{margin:10px 0;font-size:26px}.card p{margin:0;color:#627d98;line-height:1.7}.button{display:inline-flex;margin-top:24px;padding:13px 20px;border-radius:12px;background:#102a43;color:#fff;text-decoration:none;font-weight:700}.note{margin-top:16px!important;font-size:12px}
  </style>
  <script>window.location.replace('./flutter_app/preview/');</script>
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true">⌁</div>
    <div class="eyebrow">CALM FINTECH</div>
    <h1>AI 股票分析</h1>
    <p>正在為你開啟互動預覽…<br>你也可以直接點擊下方按鈕。</p>
    <a class="button" href="./flutter_app/preview/">進入股票分析畫面 →</a>
    <p class="note">分析內容僅供研究參考，不構成投資建議。</p>
  </main>
</body>
</html>
