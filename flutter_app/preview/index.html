<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI 股票分析｜互動預覽</title>
  <style>
    :root{--navy:#102a43;--teal:#1c8c8c;--red:#d64545;--green:#2e8b67;--orange:#f0a34a;--blue:#3e7cb1;--purple:#805ad5;--ink:#243b53;--muted:#829ab1;--bg:#f7f9fc;--card:#fff;--line:#e6edf3}
    *{box-sizing:border-box}body{margin:0;background:#dfe8f0;font-family:Inter,"Noto Sans TC",system-ui,sans-serif;color:var(--ink)}
    .shell{width:min(430px,100vw);min-height:100vh;margin:auto;background:var(--bg);overflow:hidden;box-shadow:0 0 45px #102a4326}
    header{padding:24px 20px 20px;color:#fff;background:linear-gradient(135deg,#102a43,#176b87)}
    .top,.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-weight:800;font-size:21px}.icon{width:36px;height:36px;border:1px solid #ffffff3b;border-radius:12px;display:grid;place-items:center}
    .eyebrow{font-size:12px;opacity:.72;margin-top:22px}.hero{display:flex;justify-content:space-between;align-items:end;margin-top:5px}.hero strong{font-size:30px;letter-spacing:-1px}.up{color:#ff9d9d}.down{color:#74d9ae}.trend{font-size:12px;padding:7px 10px;border-radius:20px;background:#ffffff1c}
    main{padding:18px 16px 92px}.label{font-size:13px;color:var(--muted);font-weight:700;margin:5px 2px 9px}.search{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:13px 14px;box-shadow:0 6px 18px #102a4308}.search input{border:0;outline:0;flex:1;font-size:14px;background:transparent}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:13px;box-shadow:0 7px 20px #102a4307}.stock-name{font-weight:800}.sub{font-size:12px;color:var(--muted);margin-top:4px}.pill{font-size:12px;padding:5px 9px;border-radius:999px;background:#e4f4ed;color:var(--green);font-weight:800}.price{font-size:23px;font-weight:800}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}.metric{background:#f7f9fc;border-radius:12px;padding:10px}.metric b{display:block;font-size:16px;margin-top:5px}.metric span{font-size:11px;color:var(--muted)}button{border:0;border-radius:13px;padding:11px 13px;font-weight:800;cursor:pointer}.primary{background:var(--navy);color:#fff;width:100%;margin-top:15px}.ghost{background:#edf6f6;color:var(--teal)}.small{padding:7px 10px;background:#f3f6f9;color:var(--muted)}.star{font-size:20px;color:#c2ced8;background:transparent;padding:0}.star.active{color:#f0a34a}.hidden{display:none}.back{display:flex;align-items:center;gap:8px;color:#fff;font-weight:800;cursor:pointer}.chart-card{padding:10px 8px 12px}.chart{width:100%;height:260px;border-radius:12px;background:linear-gradient(#fff,#fbfdff);display:block}.legend,.tabs{display:flex;gap:10px;flex-wrap:wrap;padding:8px 5px 1px;font-size:11px;color:var(--muted)}.dot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px}.tabs button{background:#f1f5f8;color:var(--muted);font-size:12px}.tabs button.selected{background:var(--navy);color:#fff}.table-row{display:flex;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line);font-size:13px}.table-row:last-child{border-bottom:0}.empty{text-align:center;color:var(--muted);padding:35px 10px}.bottom{position:fixed;bottom:0;width:min(430px,100vw);display:flex;justify-content:space-around;background:#ffffffee;border-top:1px solid var(--line);padding:11px 7px 13px;backdrop-filter:blur(12px);z-index:2}.nav{font-size:11px;color:var(--muted);text-align:center;cursor:pointer}.nav.active{color:var(--teal);font-weight:800}.nav i{display:block;font-style:normal;font-size:20px;margin-bottom:2px}.notice{font-size:11px;color:var(--muted);line-height:1.5;margin:17px 2px}.signal{font-size:12px;color:var(--teal);background:#eaf7f6;border-radius:10px;padding:9px 11px;margin-top:12px}
  </style>
</head>
<body>
<div class="shell">
  <section id="home">
    <header><div class="top"><div class="brand">AI 股票分析</div><div class="icon">⌁</div></div><div class="eyebrow">台股加權指數 · 今日市場</div><div class="hero"><strong>27,542.12</strong><span class="trend up">+0.68%</span></div></header>
    <main><div class="label">搜尋股票</div><div class="search">⌕<input id="query" placeholder="代號或公司名稱，例如 2330" oninput="filterStocks()" /></div><div id="stockList"></div><div id="analysis" class="card hidden"></div><p class="notice">資料可能延遲。AI 分析與技術指標僅供學習與研究，不構成投資建議。</p></main>
  </section>
  <section id="history" class="hidden">
    <header><div class="back" onclick="showHome()">‹ <span>返回首頁</span></div><div class="eyebrow" id="historyMarket">台股 · 技術分析</div><div class="hero"><strong id="historyTitle">2330 台積電</strong><span class="trend up" id="historyTrend">偏多</span></div></header>
    <main><div class="row"><div class="label">歷史走勢</div><button class="ghost">近 3 個月⌄</button></div><div class="tabs"><button class="selected" data-indicator="price" onclick="setIndicator('price',this)">K 線</button><button data-indicator="bollinger" onclick="setIndicator('bollinger',this)">Bollinger Bands</button><button data-indicator="kd" onclick="setIndicator('kd',this)">KD 指標</button></div><div class="card chart-card"><div id="legend" class="legend"></div><canvas class="chart" id="chart" width="800" height="520"></canvas></div><div id="indicatorSummary" class="signal">目前顯示 K 線與 MA5、MA20、MA60。</div><div class="label" style="margin-top:18px">最新交易日資料</div><div id="latestCard" class="card"></div><div class="label" style="margin-top:18px">歷史資料</div><div id="historyRows" class="card"></div><p class="notice">技術指標由後端歷史資料計算，僅供研究參考，不構成投資建議。</p></main>
  </section>
  <section id="watchlist" class="hidden"><header><div class="top"><div class="brand">我的自選股</div><div class="icon">☆</div></div><div class="eyebrow">儲存在此瀏覽器的追蹤清單</div><div class="hero"><strong id="watchCount">0 檔</strong><span class="trend">localStorage</span></div></header><main><div id="watchRows"></div><p class="notice">自選股只儲存在目前瀏覽器，不會上傳到伺服器。</p></main></section>
  <nav class="bottom"><div class="nav active" data-page="home" onclick="showHome()"><i>⌂</i>首頁</div><div class="nav" data-page="watchlist" onclick="showWatchlist()"><i>☆</i>自選股</div><div class="nav"><i>◌</i>AI 助理</div><div class="nav"><i>⚙</i>設定</div></nav>
</div>
<script>
const API_BASE='http://127.0.0.1:8000';
const stocks=[{symbol:'2330',name:'台積電',market:'tw',trend:'偏多',price:'2,230.00'},{symbol:'2317',name:'鴻海',market:'tw',trend:'觀望',price:'216.50'},{symbol:'2454',name:'聯發科',market:'tw',trend:'偏空',price:'1,180.00'},{symbol:'AAPL',name:'Apple',market:'us',trend:'偏多',price:'269.43'},{symbol:'NVDA',name:'NVIDIA',market:'us',trend:'偏多',price:'188.15'}];
let selectedStock=stocks[0], selectedIndicator='price', chartRows=[];
const readWatchlist=()=>JSON.parse(localStorage.getItem('stock-watchlist')||'[]');
const saveWatchlist=(items)=>localStorage.setItem('stock-watchlist',JSON.stringify(items));
const isWatched=(symbol)=>readWatchlist().includes(symbol);
function toggleWatch(symbol,event){event.stopPropagation();const list=readWatchlist();const next=list.includes(symbol)?list.filter(x=>x!==symbol):[...list,symbol];saveWatchlist(next);renderStocks();if(!document.querySelector('#watchlist').classList.contains('hidden'))renderWatchlist()}
function renderStocks(list=stocks){document.querySelector('#stockList').innerHTML=list.map(s=>`<div class="card" onclick="selectStock('${s.symbol}')"><div class="row"><div><div class="stock-name">${s.name}</div><div class="sub">${s.symbol} · ${s.market==='us'?'美股':'台股'}</div></div><div><button class="star ${isWatched(s.symbol)?'active':''}" onclick="toggleWatch('${s.symbol}',event)">${isWatched(s.symbol)?'★':'☆'}</button><span class="pill">${s.trend}</span></div></div><div class="row" style="margin-top:13px"><span class="sub">最新收盤</span><span class="price">${s.price}</span></div></div>`).join('')||'<div class="empty">找不到符合的股票</div>'}
function filterStocks(){const q=document.querySelector('#query').value.toLowerCase();renderStocks(stocks.filter(s=>`${s.symbol}${s.name}`.toLowerCase().includes(q)))}
async function fetchJson(path){const response=await fetch(`${API_BASE}${path}`);if(!response.ok)throw new Error('API unavailable');return response.json()}
function selectStock(symbol){selectedStock=stocks.find(s=>s.symbol===symbol)||stocks[0];const a=document.querySelector('#analysis');a.classList.remove('hidden');a.innerHTML=`<div class="row"><div><div class="stock-name">${selectedStock.name} ${selectedStock.symbol}</div><div class="sub">最新 AI 技術分析摘要</div></div><div><button class="star ${isWatched(symbol)?'active':''}" onclick="toggleWatch('${symbol}',event)">${isWatched(symbol)?'★':'☆'}</button><span class="pill">${selectedStock.trend}</span></div></div><div id="analysisMetrics" class="metrics"><div class="metric"><span>收盤價</span><b>${selectedStock.price}</b></div><div class="metric"><span>MA20</span><b>2,374.75</b></div><div class="metric"><span>RSI14</span><b>34.81</b></div></div><div id="extraIndicators" class="metrics"><div class="metric"><span>BB 上軌</span><b>2,610.20</b></div><div class="metric"><span>K9</span><b>28.40</b></div><div class="metric"><span>D9</span><b>36.20</b></div></div><button class="primary" onclick="showHistory()">查看 K 線與歷史資料 →</button>`;loadLiveAnalysis();a.scrollIntoView({behavior:'smooth'})}
async function loadLiveAnalysis(){try{const d=await fetchJson(`/api/v1/stocks/${selectedStock.symbol}/analysis?market=${selectedStock.market}&period=1y&interval=1d`);document.querySelector('#analysisMetrics').innerHTML=`<div class="metric"><span>收盤價</span><b>${d.close?.toFixed(2)||'--'}</b></div><div class="metric"><span>MA20</span><b>${d.ma20?.toFixed(2)||'--'}</b></div><div class="metric"><span>RSI14</span><b>${d.rsi14?.toFixed(2)||'--'}</b></div>`;document.querySelector('#extraIndicators').innerHTML=`<div class="metric"><span>BB 上軌</span><b>${d.bb_upper?.toFixed(2)||'--'}</b></div><div class="metric"><span>K9</span><b>${d.k9?.toFixed(2)||'--'}</b></div><div class="metric"><span>D9</span><b>${d.d9?.toFixed(2)||'--'}</b></div>`}catch(e){/* demo fallback remains visible */}}
async function showHistory(){document.querySelector('#home').classList.add('hidden');document.querySelector('#watchlist').classList.add('hidden');document.querySelector('#history').classList.remove('hidden');document.querySelector('#historyTitle').textContent=`${selectedStock.symbol} ${selectedStock.name}`;document.querySelector('#historyMarket').textContent=`${selectedStock.market==='us'?'美股':'台股'} · 技術分析`;document.querySelector('#historyTrend').textContent=selectedStock.trend;chartRows=demoRows();renderHistory();try{const d=await fetchJson(`/api/v1/stocks/${selectedStock.symbol}/history?market=${selectedStock.market}&period=3mo&interval=1d`);if(d.data?.length){chartRows=d.data;renderHistory()}}catch(e){}}
function showHome(){hidePages();document.querySelector('#home').classList.remove('hidden');setNav('home')}
function showWatchlist(){hidePages();document.querySelector('#watchlist').classList.remove('hidden');renderWatchlist();setNav('watchlist')}
function hidePages(){['home','history','watchlist'].forEach(id=>document.querySelector('#'+id).classList.add('hidden'))}
function setNav(page){document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.page===page))}
function renderWatchlist(){const list=stocks.filter(s=>readWatchlist().includes(s.symbol));document.querySelector('#watchCount').textContent=`${list.length} 檔`;document.querySelector('#watchRows').innerHTML=list.map(s=>`<div class="card" onclick="selectStock('${s.symbol}');showHistory()"><div class="row"><div><div class="stock-name">${s.name}</div><div class="sub">${s.symbol} · ${s.market==='us'?'美股':'台股'}</div></div><button class="small" onclick="toggleWatch('${s.symbol}',event)">移除</button></div><div class="row" style="margin-top:13px"><span class="pill">${s.trend}</span><span class="price">${s.price}</span></div></div>`).join('')||'<div class="empty">尚未加入自選股<br><button class="ghost" style="margin-top:14px" onclick="showHome()">去搜尋股票</button></div>'}
function demoRows(){return Array.from({length:32},(_,i)=>{const close=2200+i*2+Math.sin(i/2)*55;return {date:`2026-10-${String((i%28)+1).padStart(2,'0')}`,Open:close-12,High:close+28,Low:close-35,Close:close,Volume:20000000+i*300000,MA5:close-10,MA20:close-30,MA60:close-70,BBUpper:close+85,BBMiddle:close-30,BBLower:close-145,K9:35+Math.sin(i/3)*22,D9:42+Math.sin(i/3)*15,J9:20+Math.sin(i/2)*35}})}
function setIndicator(kind,button){selectedIndicator=kind;document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('selected'));button.classList.add('selected');renderHistory()}
function renderHistory(){const latest=chartRows[chartRows.length-1];document.querySelector('#latestCard').innerHTML=`<div class="row"><div><div class="sub">${latest.date}</div><div class="price">${Number(latest.Close).toFixed(2)}</div></div><span class="pill">${Number(latest.Close)>=Number(latest.Open)?'上漲':'下跌'}</span></div><div class="metrics"><div class="metric"><span>開盤</span><b>${Number(latest.Open).toFixed(2)}</b></div><div class="metric"><span>最高</span><b>${Number(latest.High).toFixed(2)}</b></div><div class="metric"><span>最低</span><b>${Number(latest.Low).toFixed(2)}</b></div><div class="metric"><span>BB 上軌</span><b>${latest.BBUpper?Number(latest.BBUpper).toFixed(2):'--'}</b></div><div class="metric"><span>K9 / D9</span><b>${latest.K9?Number(latest.K9).toFixed(1):'--'} / ${latest.D9?Number(latest.D9).toFixed(1):'--'}</b></div><div class="metric"><span>成交量</span><b>${Number(latest.Volume).toLocaleString()}</b></div></div>`;document.querySelector('#historyRows').innerHTML=chartRows.slice().reverse().slice(0,8).map(r=>`<div class="table-row"><span>${r.date}</span><b class="${r.Close>=r.Open?'up':'down'}">${Number(r.Close).toFixed(2)}</b></div>`).join('');const messages={price:'目前顯示 K 線與 MA5、MA20、MA60。',bollinger:'Bollinger Bands：中線為 MA20，上下軌為 20 日均線 ± 2 倍標準差。',kd:'KD 指標：K、D 以 9 日 RSV 平滑計算，J = 3K − 2D。'};document.querySelector('#indicatorSummary').textContent=messages[selectedIndicator];drawChart()}
function drawChart(){const c=document.querySelector('#chart'),ctx=c.getContext('2d'),w=c.width,h=c.height;ctx.clearRect(0,0,w,h);const rows=chartRows.slice(-40), highs=rows.map(r=>Number(r.High)), lows=rows.map(r=>Number(r.Low)), max=Math.max(...highs),min=Math.min(...lows),range=Math.max(1,max-min);const px=i=>35+i*(w-70)/(rows.length-1), py=v=>20+(max-v)/range*370;ctx.strokeStyle='#e6edf3';for(let i=0;i<5;i++){ctx.beginPath();ctx.moveTo(30,i*92+25);ctx.lineTo(w-18,i*92+25);ctx.stroke()}document.querySelector('#legend').innerHTML=selectedIndicator==='price'?'<span><i class="dot" style="background:#d64545"></i>上漲</span><span><i class="dot" style="background:#2e8b67"></i>下跌</span><span><i class="dot" style="background:#f0a34a"></i>MA5</span><span><i class="dot" style="background:#3e7cb1"></i>MA20</span><span><i class="dot" style="background:#805ad5"></i>MA60</span>':selectedIndicator==='bollinger'?'<span><i class="dot" style="background:#f0a34a"></i>BB 上軌</span><span><i class="dot" style="background:#3e7cb1"></i>BB 中線</span><span><i class="dot" style="background:#805ad5"></i>BB 下軌</span>':'<span><i class="dot" style="background:#d64545"></i>K9</span><span><i class="dot" style="background:#3e7cb1"></i>D9</span><span><i class="dot" style="background:#805ad5"></i>J9</span>';
function line(key,color,mapper=py){ctx.strokeStyle=color;ctx.lineWidth=4;ctx.beginPath();rows.forEach((r,i)=>{const v=Number(r[key]);const y=mapper(v);i?ctx.lineTo(px(i),y):ctx.moveTo(px(i),y)});ctx.stroke()}
if(selectedIndicator==='price'){rows.forEach((r,i)=>{const x=px(i),up=Number(r.Close)>=Number(r.Open);ctx.strokeStyle=up?'#d64545':'#2e8b67';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,py(r.High));ctx.lineTo(x,py(r.Low));ctx.stroke();ctx.lineWidth=10;ctx.beginPath();ctx.moveTo(x,py(Math.max(r.Open,r.Close)));ctx.lineTo(x,py(Math.min(r.Open,r.Close)));ctx.stroke()});line('MA5','#f0a34a');line('MA20','#3e7cb1');line('MA60','#805ad5')}else if(selectedIndicator==='bollinger'){line('BBUpper','#f0a34a');line('BBMiddle','#3e7cb1');line('BBLower','#805ad5');line('Close','#d64545')}else{const kdMin=0,kdMax=100;const ky=v=>35+(kdMax-v)/(kdMax-kdMin)*330;line('K9','#d64545',ky);line('D9','#3e7cb1',ky);line('J9','#805ad5',ky)} }
renderStocks();
</script>
</body>
</html>
