<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#102a43" />
  <title>AI 股票分析｜互動預覽</title>
  <style>
    :root {
      --navy: #102a43;
      --navy-2: #153c5d;
      --teal: #1c8c8c;
      --teal-soft: #dff6f6;
      --red: #d64545;
      --red-soft: #ffe6e6;
      --green: #2e8b67;
      --green-soft: #e8f7ef;
      --orange: #f0a34a;
      --orange-soft: #fff2df;
      --blue: #3e7cb1;
      --blue-soft: #edf7ff;
      --purple: #805ad5;
      --purple-soft: #f1ebff;
      --ink: #243b53;
      --muted: #829ab1;
      --bg: #f3f7fa;
      --card: #ffffff;
      --line: #e6edf3;
      --shadow: 0 18px 45px rgba(16,42,67,.12);
      --radius: 22px;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; background: linear-gradient(180deg, #edf3f7 0%, #deeaf2 100%); font-family: Inter, "Noto Sans TC", system-ui, sans-serif; color: var(--ink); }
    body { min-height: 100vh; display: grid; place-items: center; padding: 18px; }
    .app { width: min(430px, 100vw); min-height: 100vh; background: var(--bg); box-shadow: 0 40px 90px rgba(16,42,67,.18); border-radius: 30px; overflow: hidden; position: relative; }

    header {
      background: linear-gradient(135deg, var(--navy) 0%, #176b87 100%);
      color: #fff;
      padding: 22px 18px 18px;
    }

    .topbar, .row, .kpis, .small-row, .metric-grid, .nav-row {
      display: flex; align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .topbar { margin-bottom: 18px; }
    .brand { font-size: 20px; font-weight: 800; letter-spacing: -0.04em; }
    .brand-mark {
      width: 36px; height: 36px; border-radius: 12px;
      background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.22);
      display: grid; place-items: center; font-size: 18px; font-weight: 700;
    }
    .eyebrow { font-size: 11px; opacity: .76; letter-spacing: .12em; text-transform: uppercase; }
    .market-strip { margin-top: 18px; display: flex; align-items: end; justify-content: space-between; }
    .ticker { font-size: 28px; font-weight: 800; letter-spacing: -0.06em; }
    .delta { font-size: 13px; font-weight: 700; padding: 8px 10px; border-radius: 999px; background: rgba(255,255,255,.12); }
    .delta.up { color: #fff4f4; }
    .delta.down { color: #e9fff6; }

    main { padding: 18px 16px 88px; }
    .search-wrap {
      display: flex; align-items: center; gap: 10px; background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 10px 12px; box-shadow: 0 7px 20px rgba(16,42,67,.04);
    }
    .search-wrap input {
      flex: 1; background: transparent; border: none; outline: none; font-size: 15px; color: var(--ink); font-family: inherit;
    }
    .chip-row { display: flex; gap: 8px; margin-top: 14px; overflow-x: auto; padding-bottom: 8px; }
    .chip { border: 1px solid var(--line); background: #fff; padding: 8px 12px; border-radius: 999px; font-size: 12px; color: var(--ink); font-weight: 700; }
    .chip.active { background: var(--navy); color: #fff; border-color: var(--navy); }

    .section { margin-top: 22px; }
    .section-head { margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
    .section-title { font-weight: 800; font-size: 16px; }
    .tiny-link { color: var(--teal); font-size: 12px; font-weight: 700; }

    .stock-list { display: grid; gap: 10px; }
    .stock-card {
      background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 14px 14px; box-shadow: 0 9px 20px rgba(16,42,67,.03); display: flex; gap: 12px; align-items: center; cursor: pointer;
    }
    .stock-icon {
      width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center; font-weight: 800; font-size: 12px; color: #fff; background: linear-gradient(135deg, var(--navy), var(--teal));
    }
    .stock-meta { flex: 1; }
    .stock-name { font-weight: 800; letter-spacing: -0.03em; }
    .stock-sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
    .trend { font-size: 11px; padding: 6px 8px; border-radius: 999px; font-weight: 800; }
    .trend.up { background: var(--red-soft); color: var(--red); }
    .trend.down { background: var(--green-soft); color: var(--green); }
    .trend.neutral { background: var(--orange-soft); color: var(--orange); }
    .price { font-weight: 800; letter-spacing: -0.04em; }

    .summary-card {
      background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 16px; margin-top: 14px; box-shadow: var(--shadow);
    }
    .summary-label { color: var(--muted); font-size: 12px; font-weight: 700; }
    .summary-price { font-size: 28px; font-weight: 800; letter-spacing: -0.06em; display: flex; align-items: end; gap: 8px; margin-top: 4px; }
    .summary-price small { font-size: 14px; color: var(--muted); font-weight: 700; }
    .metric-grid { margin-top: 16px; display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
    .metric {
      background: #f8fbff; border: 1px solid var(--line); border-radius: 14px; padding: 12px; min-height: 74px;
    }
    .metric .value { font-weight: 800; font-size: 18px; margin-top: 7px; }
    .metric .value.red { color: var(--red); }
    .metric .value.green { color: var(--green); }
    .metric .value.blue { color: var(--blue); }
    .metric .value.purple { color: var(--purple); }

    .insight-box {
      margin-top: 14px; background: linear-gradient(135deg, rgba(28,140,140,.08), rgba(16,42,67,.03)); border: 1px solid rgba(28,140,140,.15); border-radius: 18px; padding: 14px 14px; display: flex; align-items: start; gap: 10px;
    }
    .insight-mark {
      width: 28px; height: 28px; border-radius: 10px; display: grid; place-items: center; font-size: 16px; background: var(--teal-soft); color: var(--teal); font-weight: 800;
    }
    .insight-copy { flex: 1; }
    .insight-title { font-weight: 800; }
    .insight-copy p { margin: 4px 0 0; color: var(--muted); font-size: 12px; line-height: 1.6; }

    .chart-card {
      background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 16px; margin-top: 18px; box-shadow: var(--shadow);
    }
    .chart-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .tabs { display: flex; gap: 8px; }
    .tab {
      background: #f4f8fb; border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; font-size: 12px; font-weight: 700; color: var(--muted); cursor: pointer;
    }
    .tab.active { background: var(--navy); color: #fff; border-color: var(--navy); }
    canvas { width: 100%; height: 185px; display: block; background: linear-gradient(180deg, rgba(24,98,138,.04), rgba(24,98,138,0)); border-radius: 14px; }
    .chart-footer { margin-top: 12px; display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted); }

    .watchlist { display: flex; flex-direction: column; gap: 10px; }
    .mini-item {
      display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px; box-shadow: 0 9px 20px rgba(16,42,67,.03);
    }
    .mini-item .title { font-weight: 800; }
    .mini-item .meta { color: var(--muted); font-size: 11px; }
    .mini-item .pos { font-weight: 800;}
    .pos.up { color: var(--red); }
    .pos.down { color: var(--green); }

    .bottom-nav {
      position: absolute; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,.9); backdrop-filter: blur(10px); border-top: 1px solid var(--line); display: flex; justify-content: space-between; padding: 12px 18px 16px; z-index: 10;
    }
    .nav-item {
      width: 25%; text-align: center; color: var(--muted); font-size: 11px; font-weight: 700; display: flex; flex-direction: column; gap: 5px; align-items: center;
    }
    .nav-item.active { color: var(--navy); }
    .nav-icon { width: 24px; height: 24px; border-radius: 8px; display: grid; place-items: center; background: rgba(16,42,67,.05); }
    .nav-item.active .nav-icon { background: rgba(16,42,67,.08); }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="topbar">
        <div class="brand">AI 股票分析</div>
        <div class="brand-mark" aria-hidden="true">⌁</div>
      </div>
      <div class="eyebrow">今日市場概況</div>
      <div class="market-strip">
        <div>
          <div class="ticker" id="marketIndex">27,542.61</div>
          <div style="font-size:12px;opacity:.8; margin-top:2px;">台股加權指數</div>
        </div>
        <div class="delta up" id="marketDelta">+0.42%</div>
      </div>
    </header>

    <main>
      <div class="search-wrap">
        <span aria-hidden="true">⌕</span>
        <input id="searchInput" type="text" placeholder="搜尋股票 / 代號 / 公司名稱" value="2330" />
      </div>

      <div class="chip-row">
        <button class="chip active" data-filter="all">全部</button>
        <button class="chip" data-filter="tw">台股</button>
        <button class="chip" data-filter="us">美股</button>
        <button class="chip" data-filter="hot">熱門</button>
      </div>

      <section class="section">
        <div class="section-head">
          <div class="section-title">熱門股</div>
          <div class="tiny-link">查看全部</div>
        </div>
        <div class="stock-list" id="stockList"></div>
      </section>

      <section class="summary-card" id="analysisCard">
        <div class="summary-label">最新分析</div>
        <div class="summary-price"><span id="summaryPrice">2,230.00</span><small id="summaryChange">+1.68%</small></div>
        <div class="metric-grid" id="metricGrid"></div>
        <div class="insight-box">
          <div class="insight-mark">AI</div>
          <div class="insight-copy">
            <div class="insight-title" id="insightTitle">趨勢判斷：偏多</div>
            <p id="insightText">短期均線向上，成交量維持在區間上方，價格站穩支撐帶，偏多訊號較明確。</p>
          </div>
        </div>
      </section>

      <section class="chart-card">
        <div class="chart-head">
          <div class="section-title">歷史走勢</div>
          <div class="tabs">
            <button class="tab active" data-kind="1m">1M</button>
            <button class="tab" data-kind="3m">3M</button>
            <button class="tab" data-kind="6m">6M</button>
            <button class="tab" data-kind="1y">1Y</button>
          </div>
        </div>
        <canvas id="chart" width="390" height="185"></canvas>
        <div class="chart-footer">
          <span id="chartRange">近 1 個月</span>
          <span id="chartRangePrice">最新：2,230.00</span>
        </div>
      </section>

      <section class="section">
        <div class="section-head">
          <div class="section-title">自選股</div>
          <div class="tiny-link" id="watchCount">2 檔</div>
        </div>
        <div class="watchlist" id="watchlist"></div>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="底部導覽">
      <div class="nav-item active">
        <div class="nav-icon">⌂</div>
        <div>首頁</div>
      </div>
      <div class="nav-item">
        <div class="nav-icon">☆</div>
        <div>自選</div>
      </div>
      <div class="nav-item">
        <div class="nav-icon">◌</div>
        <div>AI</div>
      </div>
      <div class="nav-item">
        <div class="nav-icon">⚙</div>
        <div>設定</div>
      </div>
    </nav>
  </div>

  <script>
    const API_BASE = 'http://127.0.0.1:8000';

    const stocks = [
      { symbol: '2330', name: '台積電', market: 'tw', trend: 'up', price: 2230.0, change: 1.68, icon: 'T' },
      { symbol: '2317', name: '鴻海', market: 'tw', trend: 'down', price: 216.5, change: -0.83, icon: 'H' },
      { symbol: '2454', name: '聯發科', market: 'tw', trend: 'up', price: 1113.0, change: 1.24, icon: 'M' },
      { symbol: 'AAPL', name: 'Apple', market: 'us', trend: 'up', price: 214.87, change: 0.91, icon: 'A' },
      { symbol: 'MSFT', name: 'Microsoft', market: 'us', trend: 'neutral', price: 431.22, change: 0.36, icon: 'M' },
      { symbol: 'NVDA', name: 'NVIDIA', market: 'us', trend: 'up', price: 138.46, change: 2.29, icon: 'N' }
    ];

    const watchlist = ['2330', 'AAPL'];
    let selectedStock = stocks[0];
    let selectedRange = '1m';

    function formatCurrency(value) {
      return new Intl.NumberFormat('zh-TW', {
        minimumFractionDigits: value >= 1000 ? 2 : 2,
        maximumFractionDigits: 2
      }).format(value);
    }

    function formatPrice(value) {
      return value >= 1000 ? new Intl.NumberFormat('zh-TW').format(value) : value.toFixed(2);
    }

    function trendLabel(trend) {
      if (trend === 'up') return '偏多';
      if (trend === 'down') return '偏空';
      return '觀望';
    }

    function trendClass(trend) {
      if (trend === 'up') return 'up';
      if (trend === 'down') return 'down';
      return 'neutral';
    }

    function readWatchlist() {
      try {
        const raw = localStorage.getItem('stock-watchlist');
        return raw ? JSON.parse(raw) : watchlist;
      } catch {
        return watchlist;
      }
    }

    function saveWatchlist(list) {
      localStorage.setItem('stock-watchlist', JSON.stringify(list));
    }

    function renderStocks(list = stocks) {
      const container = document.getElementById('stockList');
      container.innerHTML = list.map((s) => `
        <div class="stock-card" data-symbol="${s.symbol}" onclick="selectStock('${s.symbol}')">
          <div class="stock-icon">${s.icon}</div>
          <div class="stock-meta">
            <div class="row">
              <div class="stock-name">${s.symbol}</div>
              <div class="trend ${trendClass(s.trend)}">${trendLabel(s.trend)}</div>
            </div>
            <div class="stock-sub">${s.name}</div>
          </div>
          <div style="text-align:right;">
            <div class="price">${formatPrice(s.price)}</div>
            <div class="stock-sub ${s.change >= 0 ? 'up' : 'down'}" style="color:${s.change >= 0 ? '#d64545' : '#2e8b67'};">${s.change >= 0 ? '+' : ''}${s.change.toFixed(2)}%</div>
          </div>
        </div>
      `).join('');
    }

    function renderWatchlist() {
      const items = readWatchlist();
      const list = stocks.filter(s => items.includes(s.symbol));
      const container = document.getElementById('watchlist');
      document.getElementById('watchCount').textContent = `${list.length} 檔`;

      if (!list.length) {
        container.innerHTML = '<div class="mini-item"><div><div class="title">尚未加入自選股</div><div class="meta">點選任一股票加入追蹤</div></div></div>';
        return;
      }

      container.innerHTML = list.map(s => `
        <div class="mini-item">
          <div>
            <div class="title">${s.symbol} ${s.name}</div>
            <div class="meta">${s.market === 'tw' ? '台股' : '美股'}</div>
          </div>
          <div class="pos ${s.change >= 0 ? 'up' : 'down'}">${s.change >= 0 ? '+' : ''}${s.change.toFixed(2)}%</div>
        </div>
      `).join('');
    }

    function renderMetricGrid(data) {
      const metricGrid = document.getElementById('metricGrid');
      const metrics = [
        { label: 'MA20', value: data.ma20, tone: 'blue' },
        { label: 'RSI14', value: data.rsi14, tone: 'purple' },
        { label: 'MACD', value: data.macd, tone: 'red' },
        { label: '量能', value: data.volume, tone: 'green' }
      ];

      metricGrid.innerHTML = metrics.map(m => `
        <div class="metric">
          <div class="summary-label">${m.label}</div>
          <div class="value ${m.tone === 'red' ? 'red' : m.tone === 'green' ? 'green' : m.tone === 'purple' ? 'purple' : 'blue'}">${m.label === '量能' ? `${m.value.toLocaleString()} 張` : m.value}</div>
        </div>
      `).join('');
    }

    function selectStock(symbol) {
      const stock = stocks.find(s => s.symbol === symbol) || stocks[0];
      selectedStock = stock;
      updateUI(stock);
      renderStocks();
    }

    function updateUI(stock) {
      const mock = {
        ma20: `${stock.price > 100 ? stock.price * 0.985 : stock.price * 0.99}`,
        rsi14: 58.2,
        macd: 1.24,
        volume: 1600000,
        trend: stock.trend,
        changeText: `${stock.change >= 0 ? '+' : ''}${stock.change.toFixed(2)}%`
      };

      document.getElementById('summaryPrice').textContent = formatPrice(stock.price);
      document.getElementById('summaryChange').textContent = `${stock.change >= 0 ? '+' : ''}${stock.change.toFixed(2)}%`;
      document.getElementById('summaryChange').style.color = stock.change >= 0 ? '#d64545' : '#2e8b67';
      document.getElementById('insightTitle').textContent = `趨勢判斷：${trendLabel(stock.trend)}`;
      document.getElementById('insightText').textContent = `${stock.name} ${stock.market === 'tw' ? '台股' : '美股'}持續在區間內整理，均線走勢與成交量配合良好，短期偏向${trendLabel(stock.trend)}。`;
      document.getElementById('chartRangePrice').textContent = `最新：${formatPrice(stock.price)}`;

      renderMetricGrid({
        ma20: Number(mock.ma20).toFixed(2),
        rsi14: `${mock.rsi14.toFixed(1)}`,
        macd: `${mock.macd.toFixed(2)}`,
        volume: mock.volume
      });

      renderChart(selectedRange);
    }

    function renderChart(range) {
      const canvas = document.getElementById('chart');
      const ctx = canvas.getContext('2d');
      const w = canvas.width;
      const h = canvas.height;
      ctx.clearRect(0, 0, w, h);

      const base = selectedStock.price;
      const points = [];
      const count = range === '1m' ? 24 : range === '3m' ? 32 : range === '6m' ? 40 : 48;

      for (let i = 0; i < count; i++) {
        const wave = Math.sin((i / count) * 7.5 + 1.2) * 12;
        const trend = (count - i) * 0.25;
        const value = base + wave + trend - (range === '6m' ? 30 : range === '1y' ? 60 : 0);
        points.push(value);
      }

      const min = Math.min(...points) - 20;
      const max = Math.max(...points) + 20;
      const xGap = w / (points.length - 1);

      ctx.strokeStyle = '#dfeaf2';
      ctx.lineWidth = 1;
      for (let i = 0; i <= 4; i++) {
        const y = (h / 4) * i;
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(w, y);
        ctx.stroke();
      }

      const yPos = (value) => h - ((value - min) / (max - min || 1)) * (h - 16) - 8;

      ctx.beginPath();
      points.forEach((value, index) => {
        const x = index * xGap;
        const y = yPos(value);
        if (index === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.strokeStyle = '#1c8c8c';
      ctx.lineWidth = 3;
      ctx.stroke();

      ctx.beginPath();
      points.forEach((value, index) => {
        const x = index * xGap;
        const y = yPos(value * 0.993);
        if (index === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.strokeStyle = '#3e7cb1';
      ctx.lineWidth = 2;
      ctx.stroke();

      const last = points[points.length - 1];
      ctx.fillStyle = '#1c8c8c';
      ctx.beginPath();
      ctx.arc(w - 8, yPos(last), 5, 0, Math.PI * 2);
      ctx.fill();

      const rangeText = {
        '1m': '近 1 個月',
        '3m': '近 3 個月',
        '6m': '近 6 個月',
        '1y': '近 1 年'
      };
      document.getElementById('chartRange').textContent = rangeText[range] || '近 1 個月';
    }

    function bindEvents() {
      document.getElementById('searchInput').addEventListener('input', (event) => {
        const q = event.target.value.trim().toLowerCase();
        if (!q) {
          renderStocks();
          return;
        }
        const filtered = stocks.filter(s => `${s.symbol}${s.name}`.toLowerCase().includes(q));
        renderStocks(filtered);
      });

      document.querySelectorAll('.chip').forEach(chip => {
        chip.addEventListener('click', () => {
          document.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c === chip));
          const filter = chip.dataset.filter;
          if (filter === 'all') renderStocks(stocks);
          else if (filter === 'tw') renderStocks(stocks.filter(s => s.market === 'tw'));
          else if (filter === 'us') renderStocks(stocks.filter(s => s.market === 'us'));
          else renderStocks(stocks.filter(s => s.trend !== 'neutral'));
        });
      });

      document.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', () => {
          document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t === tab));
          selectedRange = tab.dataset.kind;
          renderChart(selectedRange);
        });
      });
    }

    renderStocks();
    renderWatchlist();
    updateUI(selectedStock);
    bindEvents();
  </script>
</body>
</html>
